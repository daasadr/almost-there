# Produkční sestava pro Hetzner VPS.
#
# Aplikace naslouchá jen na localhost:3000 — do světa ji pouští nginx,
# který běží mimo Docker a řeší TLS (viz deploy/nginx.conf.example).
#
# Hodnoty se berou ze souboru .env vedle tohoto compose souboru.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    image: almostthere:latest
    restart: unless-stopped
    ports:
      # Jen loopback: kdyby port zůstal otevřený do internetu,
      # obešel by se tím nginx i TLS.
      #
      # Vlevo je port na serveru, vpravo uvnitř kontejneru. Když na serveru
      # běží víc projektů, nastav APP_PORT v .env na volný port — uvnitř
      # kontejneru zůstává 3000 vždy.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Rozpad cíle na nejvyšší úroveň — to, co zákazník kupuje.
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      # Nižší úrovně rozpadu. Mechaničtější práce, ale je jí nejvíc —
      # každý týden každého běžícího cíle. Laditelné bez rebuildu.
      AI_BLOCKS_MODEL: ${AI_BLOCKS_MODEL:-claude-sonnet-5}
      AI_BLOCKS_EFFORT: ${AI_BLOCKS_EFFORT:-medium}
      AI_DAYS_MODEL: ${AI_DAYS_MODEL:-claude-sonnet-5}
      AI_DAYS_EFFORT: ${AI_DAYS_EFFORT:-low}
      # Limity předplatného, ať jdou měnit bez zásahu do kódu.
      MONTHLY_PLAN_ALLOWANCE: ${MONTHLY_PLAN_ALLOWANCE:-10}
      MAX_ACTIVE_GOALS: ${MAX_ACTIVE_GOALS:-5}
      AI_MONTHLY_CAP_CZK: ${AI_MONTHLY_CAP_CZK:-100}
      AI_MONTHLY_WARN_CZK: ${AI_MONTHLY_WARN_CZK:-70}
      USD_CZK_RATE: ${USD_CZK_RATE:-23.5}
      DEMO_RATE_LIMIT_PER_HOUR: ${DEMO_RATE_LIMIT_PER_HOUR:-5}
      DEMO_MOCK: ${DEMO_MOCK:-false}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Adresa se skládá ze stejných proměnných, jaké dostane databáze —
      # heslo tak píšeš do .env jen jednou a nemůže se rozejít.
      DATABASE_URL: postgresql://${POSTGRES_USER:-almostthere}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-almostthere}?schema=public

      # --- Přihlašování ---
      AUTH_SECRET: ${AUTH_SECRET}
      # Kanonická adresa aplikace. Za reverzní proxy si ji NextAuth sám
      # neodvodí spolehlivě a odkazy pro návrat z Googlu by mířily jinam.
      AUTH_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Bez tohohle NextAuth za proxy odmítne hlavičku Host jako nedůvěryhodnou.
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}

      # --- E-maily ---
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-AlmostThere <noreply@almost-there.eu>}

      # --- Platby ---
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Jednorázový kontejner pro migrace databáze.
  #
  # Staví se z fáze `builder`, protože ta má node_modules včetně Prisma CLI —
  # výsledný běhový image je záměrně osekaný a CLI v něm není. Nespouští se
  # sám od sebe (profil `tools`), volá ho deploy skript.
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-almostthere}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-almostthere}?schema=public
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-almostthere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-almostthere}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-almostthere}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port ven nevystavujeme — do databáze se dostaneš přes `docker compose exec`
    # nebo přes SSH tunel, ne z internetu.

volumes:
  pgdata:
